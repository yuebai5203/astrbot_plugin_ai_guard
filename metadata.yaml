name: astrbot_plugin_ai_guard
display_name: AI守卫
short_desc: LLM 自动识别辱骂 AI 的行为并上报管理群，支持拉黑/禁言/删除好友
desc: |
  LLM 自动识别是否有人在认真且持续地辱骂 AI（玩笑不算），判定为攻击后带最近 30 条聊天记录用 QQ 合并转发发到管理群，方便查看对方和 AI 聊了什么。
  支持引用回复确认拉黑（禁言/删除好友/永久拉黑）、Prompt 注入攻击检测、自动跳过对话、黑名单管理、群聊提及门槛（仅检测 @ 或提起 AI 的消息，不打扰群友互喷）。
version: 1.1.0
author: yuebai
repo: https://github.com/yuebai5203/astrbot_plugin_ai_guard
astrbot_version: ">=4.24.1"
support_platforms:
  - aiocqhttp
  - telegram
social_link: https://github.com/yuebai5203
tags:
  - 辱骂检测
  - 拉黑
  - 禁言
  - 注入检测
  - 安全
